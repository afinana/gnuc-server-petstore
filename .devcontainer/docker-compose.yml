version: '3.8'
services:
  app:
    build: 
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    network_mode: service:db
    environment:
      - MONGO_URI=mongodb://localhost:27017

  db:
    image: mongo:latest
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
